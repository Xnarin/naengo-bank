[project]
name = "bank-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2.10",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "langgraph>=1.2.20",
    "langchain-google-genai>=4.4.3",
    "google-genai>=2.34.0",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "cryptography>=43",
    "apscheduler>=3.11,<4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["."]
